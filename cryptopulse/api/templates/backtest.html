<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CryptoPulse · BTC永续合约回测系统</title>
    <script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#0b0e17;color:#e8edf5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;font-size:13px}
        #topbar{height:50px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:#0f1420;border-bottom:1px solid #1a2340;flex-wrap:wrap;gap:8px}
        .logo{font-size:16px;font-weight:800;background:linear-gradient(135deg,#667eea,#764ba2);-webkit-background-clip:text;-webkit-text-fill-color:transparent;white-space:nowrap}
        .controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
        .controls label{color:#525f7a;font-size:11px}
        .controls input,.controls select{background:#131a2b;border:1px solid #1e2a45;border-radius:4px;color:#e8edf5;padding:5px 8px;font-size:12px;outline:none;width:auto}
        .btn{padding:6px 14px;border:none;border-radius:4px;font-size:12px;font-weight:600;cursor:pointer}
        .btn-primary{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff}
        .btn-secondary{background:#1e2a45;color:#8892b0}
        #stats{display:flex;gap:20px;padding:10px 16px;background:#0f1420;border-bottom:1px solid #1a2340;flex-wrap:wrap}
        .stat{display:flex;flex-direction:column;gap:2px}
        .stat-label{color:#525f7a;font-size:10px}
        .stat-value{font-weight:700;font-family:'Courier New',monospace;font-size:14px}
        .green{color:#2ecc71}.red{color:#e74c3c}.gray{color:#8892b0}
        #chart-wrap{height:calc(100vh - 280px);min-height:300px}
        #bottom{height:180px;background:#0b0e17;border-top:1px solid #1a2340;overflow:auto;padding:10px 16px}
        .tabs{display:flex;gap:0;border-bottom:1px solid #1a2340;margin-bottom:10px}
        .tab{padding:8px 16px;font-size:12px;color:#525f7a;cursor:pointer;border-bottom:2px solid transparent}
        .tab.active{color:#e8edf5;border-bottom-color:#667eea}
        .tab-content{display:none}
        .tab-content.active{display:block}
        table{width:100%;border-collapse:collapse;font-size:11px}
        th,td{padding:6px 8px;text-align:left;border-bottom:1px solid #1a2340}
        th{color:#525f7a;font-weight:600}
        #loading{position:fixed;inset:0;background:rgba(11,14,23,0.9);display:flex;align-items:center;justify-content:center;z-index:1000;flex-direction:column;gap:12px}
        .spinner{width:40px;height:40px;border:3px solid #1a2340;border-top-color:#667eea;border-radius:50%;animation:spin 1s linear infinite}
        @keyframes spin{to{transform:rotate(360deg)}}
        .risk-item{display:inline-block;padding:4px 10px;margin:4px;background:#131a2b;border-radius:4px;font-size:11px}
    </style>
</head>
<body>
    <div id="topbar">
        <div class="logo">⚡ CryptoPulse · BTC永续合约回测</div>
        <div class="controls">
            <label>周期</label>
            <select id="sel-bar">
                <option value="1m">1分钟</option>
                <option value="5m">5分钟</option>
                <option value="15m">15分钟</option>
                <option value="1H" selected>1小时</option>
                <option value="4H">4小时</option>
                <option value="1D">日线</option>
            </select>
            <label>前瞻</label>
            <select id="sel-lookahead">
                <option value="5">5根</option>
                <option value="10" selected>10根</option>
                <option value="20">20根</option>
                <option value="30">30根</option>
            </select>
            <label>本金</label>
            <input type="number" id="pos-capital" value="1000" style="width:70px">
            <label>杠杆</label>
            <input type="number" id="pos-leverage" value="1" style="width:50px">
            <label>费率</label>
            <input type="number" id="pos-fee" value="0.0005" step="0.0001" style="width:60px">
            <button class="btn btn-secondary" onclick="setRange(1)">1天</button>
            <button class="btn btn-secondary" onclick="setRange(7)">7天</button>
            <button class="btn btn-secondary" onclick="setRange(30)">30天</button>
            <button class="btn btn-primary" onclick="loadData()">开始回测</button>
        </div>
    </div>
    <div id="stats">
        <div class="stat"><span class="stat-label">总交易</span><span class="stat-value" id="stat-total">--</span></div>
        <div class="stat"><span class="stat-label">胜率</span><span class="stat-value" id="stat-winrate">--</span></div>
        <div class="stat"><span class="stat-label">盈亏比</span><span class="stat-value" id="stat-ratio">--</span></div>
        <div class="stat"><span class="stat-label">净利润</span><span class="stat-value" id="stat-pnl">--</span></div>
        <div class="stat"><span class="stat-label">ROI</span><span class="stat-value" id="stat-roi">--</span></div>
        <div class="stat"><span class="stat-label">最大回撤</span><span class="stat-value" id="stat-dd">--</span></div>
        <div class="stat"><span class="stat-label">K线数</span><span class="stat-value" id="stat-candles">--</span></div>
        <div class="stat"><span class="stat-label">状态</span><span class="stat-value gray" id="stat-status">就绪</span></div>
    </div>
    <div id="chart-wrap"></div>
    <div id="bottom">
        <div class="tabs">
            <div class="tab active" onclick="switchTab('trades')">交易明细</div>
            <div class="tab" onclick="switchTab('signals')">信号统计</div>
            <div class="tab" onclick="switchTab('risk')">风控原因</div>
        </div>
        <div id="tab-trades" class="tab-content active">
            <table>
                <thead><tr><th>时间</th><th>方向</th><th>入场</th><th>出场</th><th>止损</th><th>止盈</th><th>盈亏%</th><th>结果</th><th>原因</th></tr></thead>
                <tbody id="trades-body"></tbody>
            </table>
        </div>
        <div id="tab-signals" class="tab-content"><div id="signals-content"></div></div>
        <div id="tab-risk" class="tab-content"><div id="risk-content"></div></div>
    </div>
    <div id="loading" style="display:none"><div class="spinner"></div><div style="color:#8892b0">正在回测...</div></div>
    <input type="hidden" id="sel-start"><input type="hidden" id="sel-end">
    <script>
        let chart, candleSeries, volumeSeries;
        let candles = [], trades = [], stats = {};
        function initChart(){
            const wrap=document.getElementById('chart-wrap');
            chart=LightweightCharts.createChart(wrap,{layout:{background:{type:'solid',color:'#0b0e17'},textColor:'#525f7a',fontSize:11},grid:{vertLines:{color:'#131a2b'},horzLines:{color:'#131a2b'}},timeScale:{borderColor:'#1a2340',timeVisible:true},rightPriceScale:{borderColor:'#1a2340'}});
            candleSeries=chart.addCandlestickSeries({upColor:'#2ecc71',downColor:'#e74c3c',borderDownColor:'#e74c3c',borderUpColor:'#2ecc71',wickDownColor:'#e74c3c',wickUpColor:'#2ecc71'});
            volumeSeries=chart.addHistogramSeries({color:'#1a2340',priceFormat:{type:'volume'},priceScaleId:''});
            chart.priceScale('').applyOptions({scaleMargins:{top:0.85,bottom:0}});
            new ResizeObserver(()=>{chart.resize(wrap.clientWidth,wrap.clientHeight)}).observe(wrap);
        }
        function setRange(days){
            const now=new Date();const fmt=d=>d.toISOString().slice(0,16);
            document.getElementById('sel-end').value=fmt(now);
            document.getElementById('sel-start').value=fmt(new Date(now.getTime()-days*86400000));
            loadData();
        }
        function loadData(){
            const bar=document.getElementById('sel-bar').value;
            const lookahead=document.getElementById('sel-lookahead').value;
            const cap=document.getElementById('pos-capital').value;
            const lev=document.getElementById('pos-leverage').value;
            const fee=document.getElementById('pos-fee').value;
            const start=document.getElementById('sel-start').value;
            const end=document.getElementById('sel-end').value;
            document.getElementById('loading').style.display='flex';
            document.getElementById('stat-status').textContent='加载中...';
            let url=`/api/backtest?style=short_term&bar=${bar}&lookahead=${lookahead}&cap=${cap}&lev=${lev}&fee=${fee}&sl_cooldown=5&sl_cooldown_enabled=1&_t=${Date.now()}`;
            if(start)url+='&start='+encodeURIComponent(start);
            if(end)url+='&end='+encodeURIComponent(end);
            fetch(url).then(r=>r.json()).then(d=>{
                document.getElementById('loading').style.display='none';
                if(d.error){document.getElementById('stat-status').textContent=d.error.substring(0,50);document.getElementById('stat-status').className='stat-value red';document.getElementById('stat-status').title=d.error;return;}
                candles=d.candles||[];trades=d.trades||[];stats=d.stats||{};
                renderChart();renderStats();renderTrades();renderSignals();renderRisk();
                document.getElementById('stat-status').textContent='完成';document.getElementById('stat-status').className='stat-value green';
            }).catch(e=>{document.getElementById('loading').style.display='none';document.getElementById('stat-status').textContent='请求失败: '+e.message;document.getElementById('stat-status').className='stat-value red';});
        }
        function renderChart(){
            const cd=candles.map(c=>({time:Math.floor(c.t/1000),open:c.o,high:c.h,low:c.l,close:c.c}));
            const vd=candles.map(c=>({time:Math.floor(c.t/1000),value:c.v,color:c.c>=c.o?'rgba(46,204,113,0.3)':'rgba(231,76,60,0.3)'}));
            candleSeries.setData(cd);volumeSeries.setData(vd);chart.timeScale().fitContent();
        }
        function renderStats(){
            document.getElementById('stat-total').textContent=stats.total_trades||0;
            document.getElementById('stat-winrate').textContent=stats.win_rate?stats.win_rate.toFixed(1)+'%':'--';
            document.getElementById('stat-ratio').textContent=stats.profit_factor?stats.profit_factor.toFixed(2):'--';
            const pnl=stats.net_pnl||0;
            document.getElementById('stat-pnl').textContent=(pnl>=0?'+':'')+pnl.toFixed(2)+' USDT';
            document.getElementById('stat-pnl').className='stat-value '+(pnl>=0?'green':'red');
            document.getElementById('stat-roi').textContent=stats.roi?(stats.roi>=0?'+':'')+stats.roi.toFixed(2)+'%':'--';
            document.getElementById('stat-roi').className='stat-value '+(stats.roi>=0?'green':'red');
            document.getElementById('stat-dd').textContent=stats.max_loss?stats.max_loss.toFixed(2)+'%':'--';
            document.getElementById('stat-candles').textContent=candles.length;
        }
        function renderTrades(){
            const tb=document.getElementById('trades-body');
            if(!trades.length){tb.innerHTML='<tr><td colspan="9" style="text-align:center;color:#525f7a;padding:20px">暂无交易记录</td></tr>';return;}
            tb.innerHTML=trades.map(t=>`<tr><td>${t.time||new Date(t.timestamp).toLocaleString()}</td><td class="${t.direction==='bullish'?'green':'red'}">${t.direction==='bullish'?'做多':'做空'}</td><td>${t.entry_price?.toFixed(1)||'--'}</td><td>${t.exit_price?.toFixed(1)||'--'}</td><td>${t.sl_price?.toFixed(1)||'--'}</td><td>${t.tp_price?.toFixed(1)||'--'}</td><td class="${t.pnl_pct>=0?'green':'red'}">${t.pnl_pct>=0?'+':''}${t.pnl_pct?.toFixed(2)}%</td><td class="${t.correct?'green':'red'}">${t.correct?'盈利':'亏损'}</td><td>${t.exit_reason||'--'}</td></tr>`).join('');
        }
        function renderSignals(){
            const b=trades.filter(t=>t.direction==='bullish').length,s=trades.filter(t=>t.direction==='bearish').length;
            const w=trades.filter(t=>t.correct).length,l=trades.filter(t=>!t.correct).length;
            document.getElementById('signals-content').innerHTML=`<div style="display:flex;gap:20px;flex-wrap:wrap"><div class="risk-item">做多信号: <b class="green">${b}</b></div><div class="risk-item">做空信号: <b class="red">${s}</b></div><div class="risk-item">盈利: <b class="green">${w}</b></div><div class="risk-item">亏损: <b class="red">${l}</b></div><div class="risk-item">平均盈亏: <b>${stats.avg_pnl?.toFixed(2)||'--'}%</b></div></div>`;
        }
        function renderRisk(){
            const reasons={};trades.forEach(t=>{const r=t.exit_reason||'未知';reasons[r]=(reasons[r]||0)+1;});
            const sorted=Object.entries(reasons).sort((a,b)=>b[1]-a[1]);
            document.getElementById('risk-content').innerHTML=sorted.map(([r,c])=>`<div class="risk-item">${r}: <b>${c}</b>次 (${(c/trades.length*100).toFixed(1)}%)</div>`).join('')||'<div style="color:#525f7a">暂无数据</div>';
        }
        function switchTab(name){
            document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('tab-'+name).classList.add('active');
        }
        document.addEventListener('DOMContentLoaded',function(){
            initChart();
            const now=new Date();const fmt=d=>d.toISOString().slice(0,16);
            document.getElementById('sel-end').value=fmt(now);
            document.getElementById('sel-start').value=fmt(new Date(now.getTime()-7*86400000));
            loadData();
        });
    </script>
</body>
</html>
